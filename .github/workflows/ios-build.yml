name: iOS build

on:
  push:
    paths:
      - 'ios/**'
      - 'Makefile'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'Makefile'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-iphone-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make ios-project

      - name: Build unsigned iPhone app
        run: make ios

      - name: Upload app build product
        uses: actions/upload-artifact@v4
        with:
          name: iQuest-iphoneos-unsigned-app
          path: build/ios/DerivedData/Build/Products/Release-iphoneos/iQuest.app
          if-no-files-found: error
          retention-days: 14
