name: iOS build and IPA package

on:
  push:
    branches:
      - main
      - "work/**"
    paths:
      - "ios/**"
      - "Makefile"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "Makefile"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select and inspect Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make ios-project

      - name: Build and package unsigned iPhone IPA
        run: make ios-ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iQuest-unsigned-iphone-ipa
          path: build/ios/iQuest-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
