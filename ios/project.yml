name: iQuest
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  iQuest:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iquest.iphone16e
        PRODUCT_NAME: iQuest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "iQuest uses the rear camera for ARKit world tracking and head-pose estimation."
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - sdk: ARKit.framework
      - sdk: SwiftUI.framework
      - sdk: UIKit.framework

schemes:
  iQuest:
    build:
      targets:
        iQuest: all
    run:
      config: Debug
    archive:
      config: Release
